<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파크골프 대회 성적표</title>
<style>
  :root { --green:#2e7d32; --green-d:#1b5e20; --yellow:#fff8d6; --gray:#f2f2f2; --line:#c8c8c8; --red:#c62828; --orange:#e65100; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:18px; color:#222; background:#fafafa; }
  header { background:var(--green); color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:28px; }
  header p { margin:4px 0 0; opacity:.9; }
  nav { display:flex; gap:8px; flex-wrap:wrap; padding:12px 24px; background:#e8f5e9; position:sticky; top:0; z-index:5; }
  nav button { font-size:20px; padding:12px 22px; border:2px solid var(--green); background:#fff; color:var(--green-d); border-radius:10px; cursor:pointer; font-weight:bold; font-family:inherit; }
  nav button.on { background:var(--green); color:#fff; }
  main { padding:16px 24px 60px; }
  section { display:none; }
  section.on { display:block; }
  .hint { color:#555; margin:4px 0 12px; }
  .warn { background:#ffebee; color:var(--red); padding:12px 16px; border-radius:8px; font-weight:bold; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; background:#fff; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:center; }
  th { background:var(--green); color:#fff; }
  td.calc { background:var(--gray); }
  input, select { font-size:18px; font-family:inherit; }
  #entry input, #entry select { border:1px solid #bbb; background:var(--yellow); padding:6px; border-radius:4px; }
  #entry .name, #entry .club { width:7em; }
  #entry .grp { width:3.5em; }
  #entry .sc { width:3em; text-align:center; }
  #entry input.bad { border:2px solid var(--red); background:#ffebee; }
  .st-입력중 { color:var(--orange); font-weight:bold; }
  .st-이름없음, .st-점수확인 { color:var(--red); font-weight:bold; }
  .st-완료 { color:var(--green); }
  .btn { font-size:18px; padding:10px 18px; border-radius:8px; border:1px solid #999; background:#fff; cursor:pointer; font-family:inherit; }
  .btn.main { background:var(--green); color:#fff; border-color:var(--green); font-weight:bold; }
  .btn.danger { color:var(--red); border-color:var(--red); }
  .del { border:none; background:none; color:#999; font-size:20px; cursor:pointer; }
  tr.r1 td { background:#ffe082; }
  tr.r2 td { background:#e0e0e0; }
  tr.r3 td { background:#ffcc80; }
  .toolbar { display:flex; gap:12px; align-items:center; margin:12px 0; flex-wrap:wrap; }
  .saved { color:var(--green); }
  .stats span { margin-right:24px; }
  .award h3 { margin:20px 0 6px; color:var(--green-d); }
  .empty { color:#888; }
  .form label { display:block; margin:14px 0 4px; font-weight:bold; }
  .form input[type=text], .form input[type=date] { width:22em; max-width:100%; padding:8px; }
  .form td input { width:9em; padding:6px; }
  .form td input.par { width:4em; text-align:center; }
  @media print {
    nav, .toolbar, .hint, .noprint { display:none !important; }
    body { font-size:11pt; background:#fff; }
    header { background:none; color:#000; padding:0 0 8px; }
    main { padding:0; }
    table { width:100%; }
    th, tr.r1 td, tr.r2 td, tr.r3 td { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    th { background:#ddd; color:#000; }
    thead { display:table-header-group; }
    tr { break-inside:avoid; }
    @page { size:A4 landscape; margin:12mm; }
  }
</style>
</head>
<body>
<header><h1 id="h-title"></h1><p id="h-sub"></p></header>
<nav>
  <button data-tab="input">성적 입력</button>
  <button data-tab="rank">순위표</button>
  <button data-tab="award">시상자</button>
  <button data-tab="setting">대회 설정</button>
</nav>
<main>
  <p id="storage-warn" class="warn" hidden>이 창을 닫으면 입력한 점수가 사라집니다. 크롬이나 엣지의 일반 창(시크릿 창 아님)에서 여세요.</p>

  <section id="input">
    <p class="hint">노란 칸에 적으세요. 적는 즉시 저장됩니다. 코스 점수는 그 코스 9홀 합계입니다. Enter를 누르면 아래 칸으로 갑니다.</p>
    <div class="scroll"><table id="entry"></table></div>
    <div class="toolbar">
      <button class="btn" id="add-rows">+ 선수 칸 10개 더 만들기</button>
      <span class="saved" id="saved"></span>
    </div>
  </section>

  <section id="rank">
    <div class="toolbar">
      <button class="btn main" onclick="window.print()">인쇄하기</button>
      <span class="stats" id="stats"></span>
    </div>
    <p class="hint" id="rule"></p>
    <div class="scroll"><table id="rank-table"></table></div>
  </section>

  <section id="award">
    <div class="toolbar"><button class="btn main" onclick="window.print()">인쇄하기</button></div>
    <div id="award-list"></div>
  </section>

  <section id="setting" class="form">
    <label for="s-title">대회명</label><input type="text" id="s-title" data-s="title">
    <label for="s-date">날짜</label><input type="date" id="s-date" data-s="date">
    <label for="s-place">장소</label><input type="text" id="s-place" data-s="place">
    <label>코스 이름과 기준타수</label>
    <table id="course-table"></table>
    <label for="s-award">부문별 시상</label>
    <select id="s-award" data-s="awardN"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select> 등까지
    <label>새 대회 시작</label>
    <p class="hint">지난 대회 선수가 남아 있으면 아래 버튼으로 지우고 시작하세요. 대회 설정은 남습니다.</p>
    <button class="btn danger" id="reset">선수와 점수 모두 지우기</button>
  </section>
</main>

<script src="rank.js"></script>
<script>
const KEY = 'parkgolf-v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const blankPlayer = () => ({ name: '', gender: '', club: '', group: '', scores: [null, null, null, null] });
const defaults = () => ({
  settings: { title: '제1회 OO 파크골프 대회', date: '', place: '', courses: ['A코스', 'B코스', 'C코스', 'D코스'], pars: [33, 33, 33, 33], awardN: 3 },
  players: Array.from({ length: 20 }, blankPlayer),
});

// 브라우저에 남은 값은 모양이 틀릴 수 있으니 필요한 칸만 골라 다시 만든다
function normalize(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.players)) throw new Error('형식이 다릅니다');
  const s = { ...defaults().settings, ...(d.settings || {}) };
  const str = v => (typeof v === 'string' || typeof v === 'number') ? String(v) : '';
  const num = v => (Number.isInteger(v) ? v : null);
  return {
    settings: {
      title: str(s.title), date: str(s.date), place: str(s.place),
      courses: [0, 1, 2, 3].map(i => str((s.courses || [])[i]) || `${'ABCD'[i]}코스`),
      pars: [0, 1, 2, 3].map(i => num((s.pars || [])[i]) ?? 33),
      awardN: Math.min(5, Math.max(1, parseInt(s.awardN, 10) || 3)),
    },
    players: d.players.map(p => ({
      name: str(p && p.name), gender: ['남', '여'].includes(p && p.gender) ? p.gender : '',
      club: str(p && p.club), group: str(p && p.group),
      scores: [0, 1, 2, 3].map(i => num(((p && p.scores) || [])[i])),
    })),
  };
}

let state;
try { state = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { state = defaults(); }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

let savedTimer;
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    $('saved').textContent = '자동 저장됨';
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => { $('saved').textContent = ''; }, 1500);
  } catch (e) {
    $('storage-warn').hidden = false;
  }
}
try { localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test'); } catch (e) { $('storage-warn').hidden = false; }

const parSum = () => state.settings.pars.reduce((a, b) => a + b, 0);
const diff = t => { const d = t - parSum(); return d > 0 ? '+' + d : String(d); };

function status(p) {
  const filled = p.scores.filter(s => s !== null);
  if (!p.name.trim() && filled.length === 0) return '';
  if (filled.some(s => !isScore(s))) return '점수확인';
  if (!p.name.trim()) return '이름없음';
  return isComplete(p) ? '완료' : '입력중';
}
const STATUS_TEXT = { 점수확인: '점수 확인', 이름없음: '이름 없음', 입력중: '입력중', 완료: '완료', '': '' };

function renderHeader() {
  const s = state.settings;
  $('h-title').textContent = s.title || '파크골프 대회';
  $('h-sub').textContent = [s.date, s.place].filter(Boolean).join('  ·  ');
  document.title = s.title || '파크골프 대회 성적표';
}

// ---------- 성적 입력 ----------
function renderEntry() {
  const c = state.settings.courses;
  const opt = (p, g) => `<option${p.gender === g ? ' selected' : ''}>${g}</option>`;
  const rows = state.players.map((p, i) => `<tr data-i="${i}">
    <td class="calc">${i + 1}</td>
    <td><input class="name" data-f="name" value="${esc(p.name)}" aria-label="${i + 1}번 이름"></td>
    <td><select data-f="gender" aria-label="${i + 1}번 성별"><option value=""></option>${opt(p, '남')}${opt(p, '여')}</select></td>
    <td><input class="club" data-f="club" value="${esc(p.club)}" aria-label="${i + 1}번 소속"></td>
    <td><input class="grp" data-f="group" value="${esc(p.group)}" aria-label="${i + 1}번 조"></td>
    ${p.scores.map((s, k) => `<td><input class="sc" data-f="s${k}" inputmode="numeric" value="${s ?? ''}" aria-label="${i + 1}번 ${esc(c[k])}"></td>`).join('')}
    <td class="calc total"></td><td class="calc st"></td>
    <td><button class="del" title="이 줄 지우기" aria-label="${i + 1}번 줄 지우기">✕</button></td>
  </tr>`).join('');
  $('entry').innerHTML = `<thead><tr><th>번호</th><th>이름</th><th>성별</th><th>소속</th><th>조</th>
    ${c.map(x => `<th>${esc(x)}</th>`).join('')}<th>합계</th><th>상태</th><th></th></tr></thead><tbody>${rows}</tbody>`;
  state.players.forEach((_, i) => updateRow(i));
}

function updateRow(i) {
  const p = state.players[i];
  const tr = $('entry').tBodies[0].rows[i];
  const st = status(p);
  tr.querySelector('.total').textContent = isComplete(p) ? p.scores.reduce((a, b) => a + b, 0) : '';
  const cell = tr.querySelector('.st');
  cell.textContent = STATUS_TEXT[st];
  cell.className = 'calc st st-' + st;
  tr.querySelectorAll('.sc').forEach((inp, k) => inp.classList.toggle('bad', p.scores[k] !== null && !isScore(p.scores[k])));
}

$('entry').addEventListener('input', e => {
  const tr = e.target.closest('tr[data-i]');
  if (!tr) return;
  const i = +tr.dataset.i, f = e.target.dataset.f, p = state.players[i];
  if (f.startsWith('s')) {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2);
    p.scores[+f[1]] = e.target.value === '' ? null : parseInt(e.target.value, 10);
  } else {
    p[f] = e.target.value;
  }
  updateRow(i);
  save();
});

$('entry').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset.f) return;
  e.preventDefault();
  const next = e.target.closest('tr').nextElementSibling;
  if (next) next.querySelector(`[data-f="${e.target.dataset.f}"]`).focus();
});

$('entry').addEventListener('click', e => {
  if (!e.target.classList.contains('del')) return;
  const i = +e.target.closest('tr').dataset.i, p = state.players[i];
  if (status(p) !== '' && !confirm(`${p.name || (i + 1) + '번'} 줄을 지울까요?`)) return;
  state.players.splice(i, 1);
  if (state.players.length === 0) state.players.push(blankPlayer());
  save();
  renderEntry();
});

$('add-rows').onclick = () => {
  for (let k = 0; k < 10; k++) state.players.push(blankPlayer());
  save();
  renderEntry();
};

// ---------- 순위표 ----------
function rankRow(p, rank, cols) {
  return `<tr class="${rank <= 3 ? 'r' + rank : ''}">${[rank + '위', ...cols(p)].map(v => `<td>${esc(v)}</td>`).join('')}</tr>`;
}

function renderRank() {
  const s = state.settings, ranked = rankPlayers(state.players);
  const named = state.players.filter(p => p.name.trim());
  const waiting = named.filter(p => !isComplete(p)).length;
  $('stats').innerHTML = `<span>참가 ${named.length}명</span><span>순위 확정 ${ranked.length}명</span>`
    + (waiting ? `<span class="st-입력중">입력중 ${waiting}명</span>` : '');
  $('rule').textContent = `합계가 같으면 ${s.courses[3]}, ${s.courses[2]}, ${s.courses[1]} 순으로 타수가 적은 선수가 앞섭니다. 모두 같으면 공동 순위입니다.`;
  if (!ranked.length) { $('rank-table').innerHTML = '<tr><td class="empty">아직 4개 코스를 모두 입력한 선수가 없습니다.</td></tr>'; return; }
  $('rank-table').innerHTML = `<thead><tr><th>순위</th><th>이름</th><th>성별</th><th>소속</th><th>조</th>
    ${s.courses.map(x => `<th>${esc(x)}</th>`).join('')}<th>합계</th><th>기준타 대비</th><th>부문 순위</th></tr></thead><tbody>`
    + ranked.map(p => rankRow(p, p.rank, q => [q.name, q.gender, q.club, q.group, ...q.scores, q.total, diff(q.total),
      q.divRank ? `${q.gender} ${q.divRank}위` : ''])).join('') + '</tbody>';
}

// ---------- 시상자 ----------
function renderAward() {
  const n = state.settings.awardN, a = awards(rankPlayers(state.players), n);
  $('award-list').innerHTML = `<p class="hint">부문별 ${n}등까지 표시합니다. 공동 순위면 모두 표시합니다.</p>`
    + Object.entries(a).map(([label, list]) => {
      const key = label === '통합' ? 'rank' : 'divRank';
      const body = list.length
        ? `<table><thead><tr><th>순위</th><th>이름</th><th>성별</th><th>소속</th><th>조</th><th>합계</th><th>기준타 대비</th></tr></thead><tbody>`
          + list.map(p => rankRow(p, p[key], q => [q.name, q.gender, q.club, q.group, q.total, diff(q.total)])).join('') + '</tbody></table>'
        : '<p class="empty">해당 선수가 없습니다.</p>';
      return `<div class="award"><h3>${label}</h3>${body}</div>`;
    }).join('');
}

// ---------- 대회 설정 ----------
function renderSetting() {
  const s = state.settings;
  ['title', 'date', 'place', 'awardN'].forEach(k => { document.querySelector(`[data-s="${k}"]`).value = s[k]; });
  $('course-table').innerHTML = '<tr><th>순서</th><th>코스 이름</th><th>기준타수</th></tr>'
    + s.courses.map((c, i) => `<tr><td>${i + 1}번째</td><td><input data-c="${i}" value="${esc(c)}"></td>
      <td><input class="par" data-p="${i}" inputmode="numeric" value="${s.pars[i]}"></td></tr>`).join('');
}

$('setting').addEventListener('input', e => {
  const t = e.target, s = state.settings;
  if (t.dataset.s) s[t.dataset.s] = t.dataset.s === 'awardN' ? +t.value : t.value;
  else if (t.dataset.c) s.courses[+t.dataset.c] = t.value;
  else if (t.dataset.p) {
    t.value = t.value.replace(/\D/g, '').slice(0, 2);
    const v = parseInt(t.value, 10);
    if (!(v >= 9 && v <= 99)) return; // 다 적을 때까지 저장하지 않음
    s.pars[+t.dataset.p] = v;
  } else return;
  save();
  renderHeader();
});

$('reset').onclick = () => {
  if (!confirm('모든 선수와 점수가 지워집니다. 되돌릴 수 없습니다.\n계속할까요?')) return;
  state.players = Array.from({ length: 20 }, blankPlayer);
  save();
  showAll();
};

// ---------- 탭 ----------
const RENDER = { input: renderEntry, rank: renderRank, award: renderAward, setting: renderSetting };
function showTab(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('section').forEach(sec => sec.classList.toggle('on', sec.id === tab));
  RENDER[tab]();
  try { sessionStorage.setItem(KEY + '-tab', tab); } catch (e) {}
}
function showAll() { renderHeader(); showTab(document.querySelector('nav button.on')?.dataset.tab || 'input'); }
document.querySelector('nav').onclick = e => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); };

renderHeader();
let startTab = 'input';
try { startTab = sessionStorage.getItem(KEY + '-tab') || 'input'; } catch (e) {}
showTab(RENDER[startTab] ? startTab : 'input');
</script>
</body>
</html>
